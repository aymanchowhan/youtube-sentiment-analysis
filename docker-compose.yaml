services:

  dashboard:
    build: .
    container_name: youtube-sentiment-dashboard
    command: >
      streamlit run dashboard/appdemo.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mlflow:
    build: .
    container_name: youtube-mlflow
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped